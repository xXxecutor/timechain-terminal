# Baut die Firmware bei jedem Versions-Tag (z. B. v1.2.0), haengt firmware.bin an das
# GitHub-Release und veroeffentlicht den Web-Flasher auf GitHub Pages.
# Einmalig im Repo einstellen: Settings -> Pages -> Source: "GitHub Actions".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Release anlegen
  pages: write      # GitHub Pages
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware bauen
        run: pio run

      - name: Dateien fuer Web-Flasher und WLAN-Update erzeugen
        run: python scripts/make_release.py

      - name: Version aus Tag und config.h vergleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' src/config.h)
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu FW_VERSION $V in src/config.h"; exit 1
          fi

      - name: GitHub-Release mit firmware.bin
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.bin
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-flasher

  pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
