; Bitcoin-Terminal fuer Good Display GDP075FW1
; (ESP32-M075 / ESP32-WROOM-32D + 7,5" 4-Farben-E-Paper GDEM075F52, 800x480)

[env:gdp075fw1]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
; zwei App-Bereiche à 1,875 MB fuer Updates ueber WLAN (OTA), NVS bleibt an 0x9000
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.5
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    bblanchon/ArduinoJson @ ^7.2.1
    tzapu/WiFiManager @ ^2.0.17
